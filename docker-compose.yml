services:
  # ==========================================
  # NestJS Backend Server
  # ==========================================
  server:
    container_name: real_estate_server
    image: hieusgu/real-estate-server:latest
    restart: unless-stopped
    env_file:
      - apps/server/.env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - real-estate-net

networks:
  real-estate-net:
    driver: bridge